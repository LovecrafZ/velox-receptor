<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Velox TV</title>
<!-- Velox TV · receptor Cast propio (CAF + Shaka) · v2.5 -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  cast-media-player {
    --theme-hue: 200;
    --progress-color: #00a8ff;
    --splash-image: none;
    --logo-image: none;
    --font-family: "Google Sans", Roboto, sans-serif;
  }
  #vx-crono { position: fixed; z-index: 2147483647 !important; top: 4vh; right: 3vw; z-index: 9999; padding: .6em 1em; border-radius: 10px;
    background: rgba(8,10,14,.82); color: #fff; font: 600 22px/1.2 Roboto, sans-serif; border-left: 4px solid #00a8ff;
    opacity: 0; transition: opacity .4s; pointer-events: none; }
  #vx-crono.ver { opacity: 1; }
  #vx-crono small { display: block; color: #8a92a0; font-weight: 400; font-size: 15px; }
  /* v2.5 · siguiente capitulo: la MISMA tarjeta y cuenta atras que el mando de la tablet (la manda la tablet) */
  #vx-sig { position: fixed; right: 3vw; bottom: 9vh; z-index: 2147483646 !important; max-width: 460px; padding: 14px 20px; border-radius: 14px;
    background: rgba(14,16,22,.96); border: 1px solid #00a8ff; box-shadow: 0 0 30px rgba(0,168,255,.4); color: #fff; font-family: Roboto, sans-serif;
    opacity: 0; transform: translateY(12px); transition: opacity .35s, transform .35s; pointer-events: none; }
  #vx-sig.ver { opacity: 1; transform: none; }
  #vx-sig .q { font-size: 15px; color: #9fb6d8; margin-bottom: 4px; }
  #vx-sig .n { font-size: 19px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 12px; }
  #vx-sig .bs { display: flex; gap: 12px; }
  #vx-sig .bs div { padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 15px; background: rgba(255,255,255,.1); }
  #vx-sig .bs div.si { background: #00a8ff; color: #001018; }
  #vx-sig .bs b { font-size: 17px; margin-left: 6px; }
  /* v2.4 · canales: barra de zapping como en la tablet (logo, programa, horas, linea de progreso, canal) */
  #vx-zap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2147483645; display: flex; align-items: flex-end; gap: 26px;
    padding: 70px 4vw 4.5vh; background: linear-gradient(to top, rgba(0,0,0,.9) 0%, rgba(0,0,0,.7) 55%, rgba(0,0,0,0) 100%);
    color: #fff; font-family: Roboto, sans-serif; opacity: 0; transform: translateY(16px); transition: opacity .35s, transform .35s; pointer-events: none; }
  #vx-zap.ver { opacity: 1; transform: none; }
  #vx-zap .lg { width: 132px; height: 88px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 2px 8px rgba(0,0,0,.6)); }
  #vx-zap .lg[src=""] { visibility: hidden; }
  #vx-zap .cu { flex: 1; min-width: 0; }
  #vx-zap .ti { font-size: 25px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #vx-zap .fi { display: flex; align-items: center; gap: 14px; margin-top: 8px; color: #d0d4dc; font-size: 16px; white-space: nowrap; }
  #vx-zap .pr { width: 96px; height: 3px; background: rgba(255,255,255,.25); flex-shrink: 0; }
  #vx-zap .pr > div { height: 100%; background: #fff; }
  #vx-zap .nu { color: #fff; font-weight: 700; }
  #vx-zap .bd { border: 1px solid rgba(255,255,255,.35); border-radius: 4px; padding: 1px 6px; font-size: 12px; color: #ccc; background: rgba(255,255,255,.08); }
  #vx-zap .si { margin-top: 8px; color: #aab0bb; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #vx-zap .vacio { display: none; }
  /* v2.5 · peliculas y capitulos: tarjeta como el marco de detalles de los canales (caratula + datos), sobre fondo oscuro */
  #vx-carga { position: fixed; inset: 0; z-index: 2147483644; display: flex; align-items: center; justify-content: center;
    background: #07080c; color: #fff; font-family: Roboto, sans-serif; opacity: 0; pointer-events: none; overflow: hidden; }
  #vx-carga.ver { opacity: 1; }
  #vx-carga.sale { transition: opacity .5s; }
  #vx-carga .fo { position: absolute; inset: -30px; background: center / cover no-repeat; filter: blur(8px) brightness(.3); opacity: 0; transition: opacity .6s; }
  #vx-carga .fo.ok { opacity: 1; }
  #vx-carga .tj { position: relative; display: flex; gap: 26px; align-items: flex-start; width: 64vw; max-width: 860px; padding: 26px 28px; border-radius: 14px;
    background: rgba(14,16,22,.94); border: 1px solid rgba(0,168,255,.2); box-shadow: 0 8px 32px rgba(0,0,0,.6); opacity: 0; transition: opacity .25s; }
  #vx-carga .tj.ok { opacity: 1; }
  #vx-carga .ca { width: 170px; height: 255px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: #111; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  #vx-carga .ca.no { display: none; }
  #vx-carga .tx { flex: 1; min-width: 0; }
  #vx-carga .ti { font-size: 26px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #vx-carga .ep { font-size: 18px; color: #fff; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #vx-carga .m1 { color: #00a8ff; font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  #vx-carga .m2 { color: #8a92a0; font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  #vx-carga .de { color: #d0d4dc; font-size: 15px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  #vx-carga .vacio { display: none; }
  #vx-carga .es { display: flex; align-items: center; gap: 12px; margin-top: 18px; color: #8a92a0; font-size: 15px; }
  #vx-carga .es i { width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); border-top-color: #00a8ff; animation: vxgira .9s linear infinite; }
  @keyframes vxgira { to { transform: rotate(360deg); } }
  /* v2.4 · al pausar: titulo pequeño arriba (la barra de tiempo es la de Google) */
  #vx-pausa { position: fixed; left: 4vw; top: 5vh; z-index: 2147483643; max-width: 60vw; color: #fff; font-family: Roboto, sans-serif;
    text-shadow: 0 2px 10px rgba(0,0,0,.8); opacity: 0; transition: opacity .35s; pointer-events: none; }
  #vx-pausa.ver { opacity: 1; }
  #vx-pausa .n { font-size: 24px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #vx-pausa .s { color: #d0d4dc; font-size: 16px; margin-top: 4px; }
</style>
</head>
<body>
<cast-media-player></cast-media-player>
<div id="vx-crono"></div>
<div id="vx-carga"><div class="fo"></div><div class="tj"><img class="ca" alt=""><div class="tx"><div class="ti"></div><div class="ep"></div><div class="m1"></div><div class="m2"></div><div class="de"></div><div class="es"><i></i><span>Cargando…</span></div></div></div></div>
<div id="vx-zap"><img class="lg" src="" alt=""><div class="cu"><div class="ti"></div><div class="fi"></div><div class="si"></div></div></div>
<div id="vx-pausa"><div class="n"></div><div class="s"></div></div>
<div id="vx-sig"><div class="q"></div><div class="n"></div><div class="bs"><div class="si">▶ Ver ya<b>→</b></div><div>Cancelar<b>←</b></div></div></div>
<script>
window.onerror = function(m, f, l){ try { var c = document.getElementById('vx-crono'); c.innerHTML = '⚠ ' + m + '<small>Velox v2.5 · línea ' + l + '</small>'; c.classList.add('ver'); } catch (e) {} };
(function(){
  var NS = 'urn:x-cast:tv.velox';                       // mensajes con la APK (tiempos, avisos)
  var context = cast.framework.CastReceiverContext.getInstance();
  var pm = context.getPlayerManager();
  var T = cast.framework.events.EventType;

  // ── ajustes de reproduccion: arrancar rapido ──
  var pc = new cast.framework.PlaybackConfig();
  pc.autoResumeDuration = 1;            // tras un parón, sigue en cuanto hay 1 s (por defecto mas)
  pc.autoResumeNumberOfSegments = 1;
  pc.initialBandwidth = 8000000;        // como ExoPlayer: empieza en calidad alta (8 Mbps), sin escalar desde abajo
  pc.segmentRequestRetryLimit = 4;
  try {
    pc.shakaConfig = {
      manifest: { dash: { ignoreMinBufferTime: true } },          // no esperar el "minBufferTime" del manifiesto
      streaming: { rebufferingGoal: 1.5, bufferingGoal: 30, retryParameters: { maxAttempts: 4, baseDelay: 300, backoffFactor: 1.5 } },
      abr: { defaultBandwidthEstimate: 8000000 },
      preferredAudioLanguage: 'es', preferredTextLanguage: 'es'
    };
  } catch (e) {}

  var opts = new cast.framework.CastReceiverOptions();
  opts.playbackConfig = pc;
  opts.useShakaForHls = true;           // HLS (Disney) tambien con Shaka, como hasta ahora
  opts.disableIdleTimeout = false;
  opts.maxInactivity = 3600;
  opts.customNamespaces = {}; opts.customNamespaces[NS] = cast.framework.system.MessageType.JSON;
  opts.statusText = 'Velox TV';

  // ── cronometro: de "cargar" a la primera imagen; se ve en la tele unos segundos y se lo cuenta a la APK ──
  var t0 = 0, titulo = '', crono = document.getElementById('vx-crono'), ocultar = null;
  function avisar(o){ try { context.sendCustomMessage(NS, undefined, o); } catch (e) {} }
  var TIEMPOS = false;   // v2.4: los tiempos ya no salen en la tele (siguen yendo al log de la APK); la APK puede pedirlos con customData.tiempos
  function enPantalla(txt, sub){
    if (!TIEMPOS && txt.charAt(0) !== '⚠') return;
    try {
      crono.innerHTML = txt + (sub ? '<small>' + sub + '</small>' : '');
      crono.classList.add('ver'); clearTimeout(ocultar);
      ocultar = setTimeout(function(){ crono.classList.remove('ver'); }, 5000);
    } catch (e) {}
  }
  function empieza(req){
    t0 = Date.now();
    try { var m = (req && (req.media || (req.items && req.items[0] && req.items[0].media))) || null; titulo = (m && m.metadata && m.metadata.title) || ''; vxNuevo(m); } catch (e) { titulo = ''; }
  }
  pm.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, function(req){ empieza(req); return req; });
  if (cast.framework.messages.MessageType.QUEUE_LOAD)
    pm.setMessageInterceptor(cast.framework.messages.MessageType.QUEUE_LOAD, function(req){ empieza(req); return req; });
  pm.addEventListener(T.LOAD_START, function(){ if (!t0) t0 = Date.now(); });   // (tambien el siguiente capitulo de la cola)
  pm.addEventListener(T.PLAYER_LOAD_COMPLETE, function(){
    if (!t0) return;
    var ms = Date.now() - t0;
    avisar({ t: 'cargado', ms: ms, titulo: titulo });
    enPantalla('⏳ ' + (ms / 1000).toFixed(1).replace('.', ',') + ' s', 'cargado · ' + (titulo || 'Velox'));
  });
  pm.addEventListener(T.PLAYING, function(){
    if (!t0) return;
    var ms = Date.now() - t0; t0 = 0;
    avisar({ t: 'viendose', ms: ms, titulo: titulo });
    enPantalla('▶ ' + (ms / 1000).toFixed(1).replace('.', ',') + ' s', 'Velox' + (titulo ? ' · ' + titulo : ''));
  });
  pm.addEventListener(T.ERROR, function(e){
    avisar({ t: 'error', codigo: e && e.detailedErrorCode, motivo: e && e.reason });
    enPantalla('⚠ Error ' + ((e && e.detailedErrorCode) || ''), 'Velox');
  });
  try {
    context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, function(){ setTimeout(function(){ avisar({ t: 'hola', v: '2.5' }); }, 500); });
  } catch (e) {}


  // ── v2: "Siguiente capitulo" en castellano (en lugar del "Up next" de Google) ──
  var sig = document.getElementById('vx-sig'), sigVisible = false, buscados = 0;
  function ocultarGoogle(){   // el aviso de Google esta dentro de su reproductor: se busca y se esconde si se deja
    var n = 0, abierto = false;
    function mirar(raiz){
      if (!raiz) return;
      if (raiz !== document) {
        abierto = true;
        if (!raiz.querySelector('#vx-st')) {
          var st = document.createElement('style'); st.id = 'vx-st';
          st.textContent = '[class*="up-next" i],[class*="upnext" i],[class*="up_next" i],[id*="up-next" i],[id*="upnext" i]{display:none!important}';
          raiz.appendChild(st);
        }
      }
      var els = raiz.querySelectorAll('*');
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        if (el.shadowRoot) mirar(el.shadowRoot);
        if (el.childElementCount === 0 && /\b(up next|next video|your next|a continuaci)/i.test(el.textContent || '')) {
          var c = el.parentElement && el.parentElement.parentElement ? el.parentElement.parentElement : (el.parentElement || el);
          if (c.style.visibility !== 'hidden') { c.style.visibility = 'hidden'; n++; }
        }
      }
    }
    try { var p = document.querySelector('cast-media-player'); mirar(p && p.shadowRoot); } catch (e) {}
    return { abierto: abierto, ocultos: n };
  }
  function pintarSiguiente(pd){
    try {
      var hay = !!(pd.preloadingNext && pd.nextTitle);
      if (!hay) { if (sigVisible) { sig.classList.remove('ver'); sigVisible = false; } return; }
      var resta = Math.max(0, Math.round((pd.duration || 0) - (pd.currentTime || 0)));
      var sub = pd.nextSubtitle || '';
      sig.querySelector('.q').textContent = sub ? 'Siguiente capítulo' : 'A continuación';
      sig.querySelector('.n').textContent = pd.nextTitle || '';
      sig.querySelector('.s').textContent = sub;
      sig.querySelector('.c').innerHTML = resta > 0 ? 'Empieza en <b>' + resta + ' s</b>' : 'Empieza ahora';
      var im = sig.querySelector('img'), u = pd.nextThumbnailUrl || '';
      if (im.getAttribute('src') !== u) im.setAttribute('src', u);
      if (!sigVisible) {
        sig.classList.add('ver'); sigVisible = true;
        var r = ocultarGoogle();
        if (buscados++ < 3) avisar({ t: 'siguiente', titulo: pd.nextTitle, googleAbierto: r.abierto, googleOcultos: r.ocultos });
      } else ocultarGoogle();
    } catch (e) {}
  }
  // (v2.5: la tarjeta ya no sigue la cuenta de Google: la manda la tablet, ver mas abajo)
  pm.addEventListener(T.LOAD_START, function(){ if (sigVisible) { sig.classList.remove('ver'); sigVisible = false; } });


  // ── v2.2 (diagnostico): como esta hecho por dentro el reproductor de Google, para poder esconder su titulo grande ──
  var volcado = false;
  function volcar(){
    if (volcado) return; volcado = true;
    try {
      var p = document.querySelector('cast-media-player'), out = [], n = 0;
      function nombre(el){ return el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + (typeof el.className === 'string' && el.className ? '.' + el.className.trim().split(/\s+/).join('.') : ''); }
      function andar(raiz, nivel, ruta){
        var hijos = raiz.children || [];
        for (var i = 0; i < hijos.length && n < 160; i++) {
          var el = hijos[i], nm = nombre(el), tx = '';
          if (!el.childElementCount) { tx = (el.textContent || '').trim().slice(0, 40); }
          var vis = '';
          try { var cs = getComputedStyle(el); vis = (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0') ? ' (oculto)' : ''; } catch (e) {}
          out.push(nivel + ' ' + nm + (tx ? ' "' + tx + '"' : '') + vis); n++;
          if (el.shadowRoot) { out.push(nivel + ' [shadow de ' + nm + ']'); andar(el.shadowRoot, nivel + 1, ruta); }
          andar(el, nivel + 1, ruta);
        }
      }
      if (!p) { avisar({ t: 'dom', nota: 'no hay cast-media-player' }); return; }
      if (!p.shadowRoot) { avisar({ t: 'dom', nota: 'shadowRoot cerrado' }); return; }
      andar(p.shadowRoot, 0, '');
      for (var k = 0; k < out.length; k += 25) avisar({ t: 'dom', parte: k / 25, l: out.slice(k, k + 25) });
    } catch (e) { avisar({ t: 'dom', error: String(e) }); }
  }
  // (v2.3: la radiografia ya no se manda; la funcion volcar() queda para otra vez)


  // ── v2.3: dentro del reproductor de Google (cast-media-player → tv-overlay) se esconden su titulo grande del principio
  //    (.overlay .metadata) y su "Up next" (.nextOverlay): quedan la barra de tiempo de Google y lo nuestro ──
  function estilosGoogle(){
    try {
      var p = document.querySelector('cast-media-player'), r = p && p.shadowRoot; if (!r) return false;
      var tv = r.querySelector('tv-overlay'), r2 = tv && tv.shadowRoot; if (!r2) return false;
      if (r2.querySelector('#vx-st2')) return true;
      var st = document.createElement('style'); st.id = 'vx-st2';
      st.textContent = '.overlay .metadata{display:none!important}.nextOverlay{display:none!important}' +
        ':host(.vx-sinbarra) .controls,:host(.vx-sinbarra) .gradient{opacity:0!important;transition:none!important}';   // v2.5: sin barra de tiempo al empezar
      r2.appendChild(st);
      avisar({ t: 'google', escondido: 'titulo y up next' });
      return true;
    } catch (e) { return false; }
  }
  (function insistir(n){ if (!estilosGoogle() && n < 40) setTimeout(function(){ insistir(n + 1); }, 500); })(0);
  pm.addEventListener(T.PLAYER_LOAD_COMPLETE, estilosGoogle);
  pm.addEventListener(T.PLAYING, estilosGoogle);

  // ── v2.4: lo que se ve en la tele, como los profesionales ──
  //   canales: barra de zapping ~4 s · peliculas/capitulos: espera con caratula y titulo, luego imagen limpia · pausa: titulo pequeño
  var zap = document.getElementById('vx-zap'), carga = document.getElementById('vx-carga'), pausa = document.getElementById('vx-pausa');
  var info = null, tZap = null, tCarga = null, toca = false;   // toca: la barra sale al verse (tras cambiar o pausar), no tras un parón de red
  function esc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function hora(ms){ var d = new Date(ms); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function datos(m){
    var md = (m && m.metadata) || {}, cd = (m && m.customData) || {}, im = (md.images && md.images[0] && md.images[0].url) || '';
    return { titulo: md.title || '', sub: md.subtitle || '', img: cd.logo || im, live: !!(m && m.streamType === 'LIVE') || cd.tipo === 'live', cd: cd };
  }
  function calidad(){
    try {
      var p = document.querySelector('cast-media-player'), v = p && p.shadowRoot && p.shadowRoot.querySelector('video');
      var h = v && v.videoHeight; if (!h) return '';
      return '<span class="bd">' + (h >= 2160 ? 'UHD' : h >= 1080 ? 'FHD' : h >= 720 ? 'HD' : 'SD') + '</span>';
    } catch (e) { return ''; }
  }
  function pintarZap(){
    if (!info) return;
    var cd = info.cd, ahora = Date.now(), ini = +cd.ini || 0, fin = +cd.fin || 0, hayProg = !!(cd.prog && fin > ini);
    zap.querySelector('.lg').setAttribute('src', info.img || '');
    zap.querySelector('.ti').textContent = hayProg ? cd.prog : (info.titulo || '');
    var f = '';
    if (hayProg && ahora < fin) {
      var pct = Math.max(0, Math.min(100, (ahora - ini) / (fin - ini) * 100)), resta = Math.max(0, Math.round((fin - ahora) / 60000));
      f += '<span>' + hora(ini) + ' — ' + hora(fin) + '</span><span class="pr"><div style="width:' + pct.toFixed(0) + '%"></div></span><span>' + resta + ' min</span>';
    } else if (!hayProg && info.sub && info.sub !== 'En directo') f += '<span>' + esc(info.sub) + '</span>';
    f += '<span class="nu">' + (cd.num ? cd.num + '&nbsp;&nbsp;' : '') + esc(cd.canal || info.titulo || '') + '</span>' + calidad();
    zap.querySelector('.fi').innerHTML = f;
    var s = zap.querySelector('.si'), sg = cd.sig;
    if (sg && sg.t && +sg.ini >= ahora - 60000) { s.textContent = hora(+sg.ini) + ' — ' + hora(+sg.fin) + '    ' + sg.t; s.classList.remove('vacio'); }
    else { s.textContent = ''; s.classList.add('vacio'); }
  }
  function verZap(ms){
    pintarZap(); zap.classList.add('ver'); clearTimeout(tZap);
    if (ms) tZap = setTimeout(function(){ zap.classList.remove('ver'); }, ms);
  }
  function quitarZap(){ clearTimeout(tZap); zap.classList.remove('ver'); }
  function durTxt(s){ s = +s || 0; if (!s) return ''; var m = Math.round(s / 60); return m >= 60 ? (Math.floor(m / 60) + ' h ' + (m % 60) + ' min') : (m + ' min'); }
  function verCarga(){   // v2.5: sale de golpe (tapa la de Google); la tarjeta, cuando llega la caratula (como mucho 0,7 s)
    var cd = info.cd, cap = cd.cap || null;
    var esCap = !!cap || /\b(T\d|E\d|S\d|temporada|cap[ií]tulo|episodio)/i.test(info.titulo + ' ' + info.sub);
    var cartel = cd.cartel || info.img || '', fondo = cd.fondo || (cap && cap.img) || cartel;
    var ti = cap ? (cd.serie || info.sub || info.titulo) : (info.titulo || '');
    var ep = cap ? ('T' + (cap.t || '?') + ':E' + (cap.e || '?') + (cap.n ? ' · ' + cap.n : '')) : (cd.tipo === 'grab' ? (info.sub || '') : (esCap ? info.sub : ''));
    var m1 = [cd.tipo === 'grab' ? 'Grabación' : (esCap ? 'Capítulo' : 'Película')], d = cap ? (cap.d || 0) : (cd.dur || 0);
    if (d) m1.push(durTxt(d));
    if (cd.tipo === 'grab' && cd.ini && cd.fin) m1.push(hora(+cd.ini) + ' – ' + hora(+cd.fin));
    var m2 = []; if (cd.gen) m2.push(cd.gen); if (cd.nota) m2.push('★ ' + cd.nota); if (cd.anyo) m2.push(cd.anyo); if (cd.pais) m2.push(cd.pais);
    var de = (cap && cap.s) || cd.sin || '';
    var $ = function(s){ return carga.querySelector(s); };
    $('.ti').textContent = ti;
    $('.ep').textContent = ep; $('.ep').classList.toggle('vacio', !ep);
    $('.m1').textContent = m1.join('  ·  ');
    $('.m2').textContent = m2.join('  ·  '); $('.m2').classList.toggle('vacio', !m2.length);
    $('.de').textContent = de; $('.de').classList.toggle('vacio', !de);
    var tj = $('.tj'), fo = $('.fo'), ca = $('.ca'), listo = false;
    tj.classList.remove('ok'); fo.classList.remove('ok');
    function mostrar(){ if (listo) return; listo = true; tj.classList.add('ok'); }
    ca.classList.toggle('no', !cartel);
    ca.onload = mostrar; ca.onerror = function(){ ca.classList.add('no'); mostrar(); };
    if (cartel) { if (ca.getAttribute('src') === cartel && ca.complete) mostrar(); else ca.setAttribute('src', cartel); } else mostrar();
    setTimeout(mostrar, 700);
    if (fondo) { var im = new Image(); im.onload = function(){ fo.style.backgroundImage = 'url("' + fondo.replace(/"/g, '%22') + '")'; fo.classList.add('ok'); }; im.src = fondo; }
    else fo.style.backgroundImage = 'none';
    carga.classList.remove('sale'); carga.classList.add('ver'); clearTimeout(tCarga);
    tCarga = setTimeout(quitarCarga, 30000);   // por si nunca arranca
  }
  function quitarCarga(){ clearTimeout(tCarga); carga.classList.add('sale'); carga.classList.remove('ver'); }
  function vxNuevo(m){   // llamado al llegar un LOAD (desde la tablet)
    try {
      info = datos(m);
      if (info.cd.tiempos) TIEMPOS = true;
      pausa.classList.remove('ver'); toca = true; sinBarra(true);
      if (info.live) { quitarCarga(); verZap(15000); }   // sale ya al cambiar; al verse, 4 s mas
      else { quitarZap(); verCarga(); }
    } catch (e) {}
  }
  function sinBarra(si){   // la barra de tiempo de Google: fuera al empezar; vuelve al pausar o tocar el mando
    try { var p = document.querySelector('cast-media-player'), tv = p && p.shadowRoot && p.shadowRoot.querySelector('tv-overlay'); if (tv) tv.classList.toggle('vx-sinbarra', !!si); } catch (e) {}
  }
  var tBarra = null;
  function alSonar(){
    clearTimeout(tBarra); if (toca) tBarra = setTimeout(function(){ sinBarra(false); }, 6000);
    pausa.classList.remove('ver');
    if (carga.classList.contains('ver')) quitarCarga();
    if (info && info.live && toca) verZap(4000);
    toca = false;
  }
  pm.addEventListener(T.PLAYING, alSonar);
  pm.addEventListener(T.ERROR, function(){ quitarCarga(); });
  pm.addEventListener(T.MEDIA_FINISHED, function(){ quitarCarga(); pausa.classList.remove('ver'); });
  pm.addEventListener(T.PAUSE, function(){
    try {
      if (!info) info = datos(pm.getMediaInformation());
      toca = true; clearTimeout(tBarra); sinBarra(false);
      if (info.live) { verZap(0); return; }   // canal en pausa: la barra se queda hasta que siga
      var mi = pm.getMediaInformation(), d = mi ? datos(mi) : info;   // (con la cola, el capitulo que suena)
      pausa.querySelector('.n').textContent = d.titulo || '';
      pausa.querySelector('.s').textContent = d.sub || '';
      pausa.classList.add('ver');
    } catch (e) {}
  });
  pm.addEventListener(T.LOAD_START, function(){   // siguiente capitulo de la cola: los datos del nuevo
    try { var mi = pm.getMediaInformation(); if (mi) info = datos(mi); } catch (e) {}
  });

  // ── v2.5: tarjeta "Siguiente capitulo" que manda la tablet (misma cuenta atras que el mando) ──
  //   → (flecha derecha) = ver ya · ← = cancelar. Cada tecla que llega se apunta en el log de la tablet.
  function verSig(o){
    sig.querySelector('.q').textContent = 'Siguiente capítulo · empieza en ' + o.n + ' s';
    sig.querySelector('.n').textContent = o.titulo || '';
    if (!sigVisible) { sig.classList.add('ver'); sigVisible = true; }
  }
  function quitarSig(){ if (sigVisible) { sig.classList.remove('ver'); sigVisible = false; } }
  try {
    context.addCustomMessageListener(NS, function(ev){
      try {
        var o = ev && ev.data; if (typeof o === 'string') o = JSON.parse(o);
        if (!o) return;
        if (o.t === 'sig') verSig(o);
        else if (o.t === 'sigFuera') quitarSig();
      } catch (e) {}
    });
  } catch (e) { avisar({ t: 'error', motivo: 'mensajes: ' + e.message }); }
  var teclas = 0;
  function tecla(e){
    try {
      var k = e.key || '', c = e.keyCode || 0;
      if (teclas++ < 60) avisar({ t: 'tecla', k: k, c: c, tarjeta: sigVisible });
      if (!sigVisible) { sinBarra(false); return; }
      if (k === 'ArrowRight' || c === 39 || c === 22 || k === 'MediaFastForward' || c === 228) { avisar({ t: 'ya' }); quitarSig(); e.preventDefault(); e.stopPropagation(); }
      else if (k === 'ArrowLeft' || c === 37 || c === 21 || k === 'MediaRewind' || c === 227) { avisar({ t: 'no' }); quitarSig(); e.preventDefault(); e.stopPropagation(); }
    } catch (x) {}
  }
  window.addEventListener('keydown', tecla, true);
  // plan B: si Google se queda la flecha y la convierte en "avanzar", con la tarjeta puesta se usa como ver ya / cancelar
  pm.setMessageInterceptor(cast.framework.messages.MessageType.SEEK, function(req){
    try {
      var de = '', s = context.getSenders ? context.getSenders() : [];
      for (var i = 0; i < s.length; i++) de += s[i].id + ',';
      var mando = !req.senderId || de.indexOf(req.senderId + ',') < 0;   // no viene de la tablet: es el mando de la tele
      avisar({ t: 'tecla', seek: true, rel: req.relativeTime, a: req.currentTime, de: req.senderId || '', mando: mando, tarjeta: sigVisible });
      sinBarra(false);
      if (sigVisible && mando) {
        var adelante = (req.relativeTime != null) ? req.relativeTime > 0 : (req.currentTime || 0) > (pm.getCurrentTimeSec() || 0);
        avisar({ t: adelante ? 'ya' : 'no' }); quitarSig();
        return null;
      }
    } catch (e) {}
    return req;
  });

  context.start(opts);
  if (TIEMPOS) enPantalla('Velox TV', 'receptor v2.5 listo');   // al abrirse (solo con los tiempos en pantalla)
})();
</script>
