<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Velox TV</title>
<!-- Velox TV · receptor Cast propio (CAF + Shaka) · v1.1 -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  cast-media-player {
    --theme-hue: 200;
    --progress-color: #00a8ff;
    --splash-image: none;
    --logo-image: none;
    --font-family: "Google Sans", Roboto, sans-serif;
  }
  #vx-crono { position: fixed; top: 4vh; right: 3vw; z-index: 9999; padding: .6em 1em; border-radius: 10px;
    background: rgba(8,10,14,.82); color: #fff; font: 600 22px/1.2 Roboto, sans-serif; border-left: 4px solid #00a8ff;
    opacity: 0; transition: opacity .4s; pointer-events: none; }
  #vx-crono.ver { opacity: 1; }
  #vx-crono small { display: block; color: #8a92a0; font-weight: 400; font-size: 15px; }
</style>
</head>
<body>
<cast-media-player></cast-media-player>
<div id="vx-crono"></div>
<script>
(function(){
  var NS = 'urn:x-cast:tv.velox';                       // mensajes con la APK (tiempos, avisos)
  var context = cast.framework.CastReceiverContext.getInstance();
  var pm = context.getPlayerManager();
  var T = cast.framework.events.EventType;

  // ── ajustes de reproduccion: arrancar rapido ──
  var pc = new cast.framework.PlaybackConfig();
  pc.autoResumeDuration = 1;            // tras un parón, sigue en cuanto hay 1 s (por defecto mas)
  pc.autoResumeNumberOfSegments = 1;
  pc.initialBandwidth = 8000000;        // como ExoPlayer: empieza en calidad alta (8 Mbps), sin escalar desde abajo
  pc.segmentRequestRetryLimit = 4;
  try {
    pc.shakaConfig = {
      manifest: { dash: { ignoreMinBufferTime: true } },          // no esperar el "minBufferTime" del manifiesto
      streaming: { rebufferingGoal: 1.5, bufferingGoal: 30, retryParameters: { maxAttempts: 4, baseDelay: 300, backoffFactor: 1.5 } },
      abr: { defaultBandwidthEstimate: 8000000 },
      preferredAudioLanguage: 'es', preferredTextLanguage: 'es'
    };
  } catch (e) {}

  var opts = new cast.framework.CastReceiverOptions();
  opts.playbackConfig = pc;
  opts.useShakaForHls = true;           // HLS (Disney) tambien con Shaka, como hasta ahora
  opts.disableIdleTimeout = false;
  opts.maxInactivity = 3600;
  opts.customNamespaces = {}; opts.customNamespaces[NS] = cast.framework.system.MessageType.JSON;
  opts.statusText = 'Velox TV';

  // ── cronometro: de "cargar" a la primera imagen; se ve en la tele unos segundos y se lo cuenta a la APK ──
  var t0 = 0, titulo = '', crono = document.getElementById('vx-crono'), ocultar = null;
  function avisar(o){ try { context.sendCustomMessage(NS, undefined, o); } catch (e) {} }
  function enPantalla(txt, sub){
    try {
      crono.innerHTML = txt + (sub ? '<small>' + sub + '</small>' : '');
      crono.classList.add('ver'); clearTimeout(ocultar);
      ocultar = setTimeout(function(){ crono.classList.remove('ver'); }, 5000);
    } catch (e) {}
  }
  function empieza(req){
    t0 = Date.now();
    try { var m = (req && (req.media || (req.items && req.items[0] && req.items[0].media))) || null; titulo = (m && m.metadata && m.metadata.title) || ''; } catch (e) { titulo = ''; }
  }
  pm.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, function(req){ empieza(req); return req; });
  if (cast.framework.messages.MessageType.QUEUE_LOAD)
    pm.setMessageInterceptor(cast.framework.messages.MessageType.QUEUE_LOAD, function(req){ empieza(req); return req; });
  pm.addEventListener(T.LOAD_START, function(){ if (!t0) t0 = Date.now(); });   // (tambien el siguiente capitulo de la cola)
  pm.addEventListener(T.PLAYER_LOAD_COMPLETE, function(){ if (t0) avisar({ t: 'cargado', ms: Date.now() - t0, titulo: titulo }); });
  pm.addEventListener(T.PLAYING, function(){
    if (!t0) return;
    var ms = Date.now() - t0; t0 = 0;
    avisar({ t: 'viendose', ms: ms, titulo: titulo });
    enPantalla('▶ ' + (ms / 1000).toFixed(1).replace('.', ',') + ' s', 'Velox' + (titulo ? ' · ' + titulo : ''));
  });
  pm.addEventListener(T.ERROR, function(e){
    avisar({ t: 'error', codigo: e && e.detailedErrorCode, motivo: e && e.reason });
    enPantalla('⚠ Error ' + ((e && e.detailedErrorCode) || ''), 'Velox');
  });
  try {
    context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, function(){ setTimeout(function(){ avisar({ t: 'hola', v: '1.1' }); }, 500); });
  } catch (e) {}

  context.start(opts);
})();
</script>
</body>
</html>
